<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Authier extension login-session flow</title>
  <desc id="description">A diagram showing a temporary extension popup reading and writing a login snapshot, while the background login manager checks trusted-device approval and completes the login.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100f" />
      <stop offset="1" stop-color="#0d1c1a" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142724" />
      <stop offset="1" stop-color="#0e1c1a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.32" />
    </filter>
  </defs>

  <rect width="1200" height="675" rx="32" fill="url(#background)" />
  <circle cx="1070" cy="80" r="210" fill="#69e6cc" opacity="0.035" />
  <circle cx="95" cy="640" r="250" fill="#69e6cc" opacity="0.025" />

  <text x="72" y="88" fill="#f4fbf9" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700">Popup login continuity</text>
  <text x="72" y="124" fill="#91aaa4" font-family="Inter, system-ui, sans-serif" font-size="17">Tagged source behavior in v1.2.10-extension</text>

  <g filter="url(#shadow)">
    <rect x="72" y="192" width="260" height="316" rx="24" fill="url(#panel)" stroke="#2f4944" />
    <rect x="97" y="221" width="210" height="36" rx="10" fill="#1a312d" />
    <circle cx="118" cy="239" r="7" fill="#69e6cc" />
    <text x="137" y="246" fill="#dce9e6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="650">Extension popup</text>
    <text x="97" y="304" fill="#91aaa4" font-family="Inter, system-ui, sans-serif" font-size="15">Temporary interface</text>
    <text x="97" y="342" fill="#f4fbf9" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="650">Edit credentials</text>
    <text x="97" y="378" fill="#f4fbf9" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="650">Show approval state</text>
    <text x="97" y="414" fill="#f4fbf9" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="650">Reopen from snapshot</text>
    <line x1="97" y1="450" x2="307" y2="450" stroke="#2f4944" />
    <text x="97" y="480" fill="#e5b85c" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="650">May close when focus moves</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="192" width="300" height="316" rx="24" fill="url(#panel)" stroke="#3a5d56" />
    <rect x="495" y="221" width="250" height="36" rx="10" fill="#17352f" />
    <circle cx="516" cy="239" r="7" fill="#69e6cc" />
    <text x="535" y="246" fill="#dce9e6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="650">Background manager</text>
    <text x="495" y="304" fill="#91aaa4" font-family="Inter, system-ui, sans-serif" font-size="15">Owns the login attempt</text>
    <rect x="495" y="330" width="250" height="44" rx="12" fill="#0b1715" stroke="#294740" />
    <text x="620" y="358" text-anchor="middle" fill="#f4fbf9" font-family="Inter, system-ui, sans-serif" font-size="16">Editing</text>
    <rect x="495" y="386" width="250" height="44" rx="12" fill="#0b1715" stroke="#36685e" />
    <text x="620" y="414" text-anchor="middle" fill="#f4fbf9" font-family="Inter, system-ui, sans-serif" font-size="16">Awaiting approval</text>
    <rect x="495" y="442" width="250" height="44" rx="12" fill="#0b1715" stroke="#294740" />
    <text x="620" y="470" text-anchor="middle" fill="#f4fbf9" font-family="Inter, system-ui, sans-serif" font-size="16">Completing</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="908" y="192" width="220" height="316" rx="24" fill="url(#panel)" stroke="#2f4944" />
    <rect x="933" y="221" width="170" height="36" rx="10" fill="#1a312d" />
    <circle cx="954" cy="239" r="7" fill="#69e6cc" />
    <text x="973" y="246" fill="#dce9e6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="650">Session snapshot</text>
    <text x="933" y="304" fill="#91aaa4" font-family="Inter, system-ui, sans-serif" font-size="15">Extension session storage</text>
    <text x="933" y="344" fill="#f4fbf9" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="650">Draft credentials</text>
    <text x="933" y="380" fill="#f4fbf9" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="650">Attempt state</text>
    <text x="933" y="416" fill="#f4fbf9" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="650">Pending challenge</text>
    <line x1="933" y1="450" x2="1103" y2="450" stroke="#2f4944" />
    <text x="933" y="479" fill="#e5b85c" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="650">Includes plaintext password</text>
  </g>

  <rect x="352" y="328.5" width="90" height="3" fill="#69e6cc" />
  <path d="M 450 330 L 438 323 L 438 337 Z" fill="#69e6cc" />
  <rect x="360" y="384.5" width="90" height="3" fill="#69e6cc" />
  <path d="M 352 386 L 364 379 L 364 393 Z" fill="#69e6cc" />
  <text x="402" y="312" text-anchor="middle" fill="#91aaa4" font-family="Inter, system-ui, sans-serif" font-size="13">commands</text>
  <text x="402" y="413" text-anchor="middle" fill="#91aaa4" font-family="Inter, system-ui, sans-serif" font-size="13">snapshot</text>

  <rect x="790" y="328.5" width="90" height="3" fill="#69e6cc" />
  <path d="M 888 330 L 876 323 L 876 337 Z" fill="#69e6cc" />
  <rect x="798" y="384.5" width="90" height="3" fill="#69e6cc" />
  <path d="M 790 386 L 802 379 L 802 393 Z" fill="#69e6cc" />
  <text x="840" y="312" text-anchor="middle" fill="#91aaa4" font-family="Inter, system-ui, sans-serif" font-size="13">write</text>
  <text x="840" y="413" text-anchor="middle" fill="#91aaa4" font-family="Inter, system-ui, sans-serif" font-size="13">restore</text>

  <rect x="240" y="570" width="720" height="48" rx="24" fill="#0a1715" stroke="#294740" />
  <text x="600" y="600" text-anchor="middle" fill="#b8cbc6" font-family="Inter, system-ui, sans-serif" font-size="16">Successful login, explicit reset, authenticated-device cleanup, or session end clears the saved attempt</text>
</svg>
