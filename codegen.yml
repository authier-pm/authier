overwrite: true
schema: './backend/gqlSchemas/authier.graphql'
documents: ['web-extension/**/*.gql', 'shared/**/*.gql']
generates:
  shared/generated/graphqlBaseTypes.ts:
    plugins:
      - typescript
      - add:
          content: 'export type Exact<T extends Record<string, unknown>> = { [K in keyof T]: T[K] }'
  shared/generated:
    config:
      enumValues:
        WebInputType: '@shared/generated/graphqlBaseTypes#WebInputType'
    plugins:
      - typescript-operations
      - typescript-react-apollo

    preset: near-operation-file
    presetConfig:
      extension: .codegen.tsx
      baseTypesPath: ~@shared/generated/graphqlBaseTypes

  shared/generated/graphqlSchemaFragments.ts:
    plugins:
      - fragment-matcher
      - add:
          content: '// @ts-nocheck THIS IS A GENERATED FILE, DO NOT EDIT'

# hooks:
# afterAllFileWrite: -npx prettier --write

config:
  withHooks: true
  withHOC: false
  withComponent: false
  withMutationFn: false
  withMutationOptionsType: false
  reactApolloVersion: 3
  apolloReactCommonImportFrom: '@apollo/client/react'
  apolloReactHooksImportFrom: '@apollo/client/react'
  scalars:
    JSON: unknown
    UUID: string
    EmailAddress: string
    NonEmptyString: string
    BigInt: number
    EmailAddressWithTLD: string
    NonNegativeFloat: number
    NonNegativeInt: number
    PositiveInt: number
    DateTime: string
  namingConvention:
    enumValues: keep
