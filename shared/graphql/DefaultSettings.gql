mutation updateDefaultDeviceSettings($config: DefaultSettingsInput!) {
  me {
    defaultDeviceSettings {
      id
      update(config: $config) {
        id
        autofillTOTPEnabled
        passkeyCreationVerificationRequired
        theme
        syncTOTP
        vaultLockTimeoutSeconds
      }
    }
  }
}

mutation updateMasterDeviceResetTimeout(
  $deviceRecoveryCooldownMinutes: NonNegativeInt!
) {
  me {
    setDeviceRecoveryCooldownMinutes(
      deviceRecoveryCooldownMinutes: $deviceRecoveryCooldownMinutes
    ) {
      id
      deviceRecoveryCooldownMinutes
    }
  }
}

query defaultSettings {
  me {
    id
    masterDeviceId
    uiLanguage
    deviceRecoveryCooldownMinutes
    masterDeviceResetConfig
    defaultDeviceSettings {
      id
      autofillTOTPEnabled
      passkeyCreationVerificationRequired
      syncTOTP
      vaultLockTimeoutSeconds
      theme
    }
  }
}

mutation updateMasterDeviceResetConfig($config: JSON!) {
  me { setMasterDeviceResetConfig(config: $config) { id masterDeviceResetConfig deviceRecoveryCooldownMinutes } }
}
